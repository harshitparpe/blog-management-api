server:
  port: ${PORT:8080}
spring:
  application: { name: blog-management-api }
  datasource: { url: ${DB_URL:jdbc:mysql://localhost:3306/blog_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}, username: ${DB_USERNAME:blog_user}, password: ${DB_PASSWORD:blog_password} }
  jpa: { hibernate: { ddl-auto: ${DDL_AUTO:update} }, open-in-view: false, properties: { hibernate: { format_sql: true } } }
  jackson: { default-property-inclusion: non_null }
app:
  jwt: { secret: ${JWT_SECRET:change-this-development-secret-to-a-strong-32-byte-minimum-value}, expiration-ms: ${JWT_EXPIRATION_MS:86400000} }
springdoc: { swagger-ui: { path: /swagger-ui/index.html } }
